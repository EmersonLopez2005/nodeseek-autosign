services:
  nodeseek-login-agent:
    build:
      context: .
      args:
        # patchright(轻) 或 camoufox(强)
        ENGINE: patchright
    image: nodeseek-login-agent:latest
    container_name: nodeseek-login-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "3000"
      AGENT_HEADLESS: "false"   # 必须 false（配 Xvfb），无头过不了 CF
      # 每台机器给自己的出口。如果这台机器本身就是家宽直连，删掉这一行
      # AGENT_PROXY: "http://user:pass@127.0.0.1:7890"
      TZ: Asia/Shanghai
    ports:
      # 只给内网/组网用，别直接裸奔公网
      - "3000:3000"
    volumes:
      # profile / cookie / 日志都在这里，换镜像不丢指纹
      - ./data:/app/data
    shm_size: "512mb"
    security_opt:
      - seccomp=unconfined
    # 资源上限：浏览器只在登录那 30~60 秒吃内存，平时 agent 只有几十 MB。
    # 限制住是为了防止 Chromium 抽风把整台机器拖死。
    # 1G 内存的小机器可以调成 800M，但要配合宿主机 swap。
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
